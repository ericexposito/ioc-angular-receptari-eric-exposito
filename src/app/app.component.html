<div class="contenidor">
  <header class="capcalera">
    <h1>{{ nomApp }}</h1>
    <p>Eric Expósito Torres. Consulta i filtra les receptes de cuina del receptari.</p>
  </header>

  <app-recepta-filters (filtresAplicats)="onFiltresAplicats($event)" />

  <div class="cos">
    <main id="contingut-principal" class="principal">
      <app-recepta-list
        [receptes]="receptesFiltrades"
        [idSeleccionada]="receptaActual?.id ?? null"
        (receptaSeleccionada)="onReceptaSeleccionada($event)" />
    </main>

    <aside class="lateral">
      <h2>Recepta seleccionada</h2>
      @if (receptaActual) {
        <p>{{ receptaActual.titol }}</p>
      } @else {
        <p>Cap recepta seleccionada.</p>
      }
    </aside>
  </div>
</div>

<router-outlet />
